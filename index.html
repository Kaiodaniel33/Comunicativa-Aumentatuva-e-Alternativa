<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1F6E5C">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="description" content="Aplicativo de Comunicação Aumentativa e Alternativa (CAA) acessível, personalizável e pronto para uso offline em tablets e smartphones.">
  <title>ComunicaCAA — Comunicação Aumentativa e Alternativa</title>
  <style>
    :root {
      --bg-page: #F6F4EE;
      --bg-surface: #FDFCF9;
      --bg-subtle: #ECE9E0;
      --border-soft: #D6DDD8;
      --border-strong: #A8BDB4;
      --text-primary: #15293E;
      --text-secondary: #485E70;
      --accent: #1F6E5C;
      --accent-hover: #185849;
      --accent-soft: #E5F1EC;
      --accent-border: #8FBBAE;
      --amber: #C98A2E;
      --amber-soft: #F7EFE0;
      --danger-soft: #F6E9E5;
      --danger-border: #D9A79B;
      --danger-text: #8C3B2B;
      --cat-core: #E7F2EE;
      --cat-core-b: #9BC0B3;
      --cat-food: #F5EFE2;
      --cat-food-b: #D7C098;
      --cat-play: #E8F0F6;
      --cat-play-b: #A4BFD5;
      --cat-hygiene: #EAF3F2;
      --cat-hygiene-b: #9AC3C0;
      --cat-school: #EFEBF5;
      --cat-school-b: #BFB4D3;
      --cat-people: #F5ECE9;
      --cat-people-b: #D5B1A7;
      --cat-body: #F6EAE6;
      --cat-body-b: #D8A99D;
      --cat-actions: #E8F3EB;
      --cat-actions-b: #9DC3A9;
      --cat-daily: #F2F0E6;
      --cat-daily-b: #C8C1A2;
      --cat-money: #ECF2E8;
      --cat-money-b: #ABC09E;
      --cat-transport: #E9EFF4;
      --cat-transport-b: #A5BACD;
      --cat-interests: #F4EDF4;
      --cat-interests-b: #CBAECC;
      --shadow-sm: 0 2px 6px rgba(21, 41, 62, 0.05);
      --shadow-md: 0 6px 18px rgba(21, 41, 62, 0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-pill: 999px;
      --font-sans: "Inter", "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      --grid-cols: 3;
      --transition: 180ms ease;
    }

    [data-theme="night"] {
      --bg-page: #151E27;
      --bg-surface: #1E2A36;
      --bg-subtle: #253341;
      --border-soft: #314354;
      --border-strong: #4A647A;
      --text-primary: #EDF2F6;
      --text-secondary: #A7BACB;
      --accent: #3FA089;
      --accent-hover: #338B76;
      --accent-soft: #1D3934;
      --accent-border: #3B7D6E;
      --amber: #E0A852;
      --amber-soft: #362E20;
      --danger-soft: #3B2624;
      --danger-border: #8B534B;
      --danger-text: #F2B5AA;
      --cat-core: #1E3330;
      --cat-core-b: #3B6B62;
      --cat-food: #302B20;
      --cat-food-b: #6E5F42;
      --cat-play: #1E2D3B;
      --cat-play-b: #446582;
      --cat-hygiene: #1C3133;
      --cat-hygiene-b: #3D6A6E;
      --cat-school: #2A2538;
      --cat-school-b: #5C517A;
      --cat-people: #332625;
      --cat-people-b: #785450;
      --cat-body: #362523;
      --cat-body-b: #82534B;
      --cat-actions: #1E3226;
      --cat-actions-b: #406B50;
      --cat-daily: #2D2C22;
      --cat-daily-b: #666349;
      --cat-money: #243020;
      --cat-money-b: #4F6B45;
      --cat-transport: #1E2C38;
      --cat-transport-b: #456078;
      --cat-interests: #302431;
      --cat-interests-b: #6E5070;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.25);
      --shadow-md: 0 8px 22px rgba(0, 0, 0, 0.35);
    }

    [data-theme="contrast"] {
      --bg-page: #F2F0E8;
      --bg-surface: #FFFFFF;
      --bg-subtle: #E4E1D6;
      --border-soft: #15293E;
      --border-strong: #15293E;
      --text-primary: #0B1928;
      --text-secondary: #22384D;
      --accent: #125445;
      --accent-hover: #0D3F34;
      --accent-soft: #D6ECE5;
      --accent-border: #125445;
      --danger-soft: #F5DDD7;
      --danger-border: #8C2D1C;
      --danger-text: #7A2314;
    }

    [data-reduce-motion="true"] * {
      transition: none !important;
      animation: none !important;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg-page);
      color: var(--text-primary);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    button, input, select, textarea {
      font-family: inherit;
    }

    /* App Shell */
    .app-shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 12px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }

    /* Top Header */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 10px 14px;
      box-shadow: var(--shadow-sm);
      flex-wrap: wrap;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-mark {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: var(--accent);
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-text h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      line-height: 1.15;
    }

    .brand-sub {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .profile-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--accent-soft);
      border: 1.5px solid var(--accent-border);
      color: var(--text-primary);
      padding: 7px 12px;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 700;
      cursor: pointer;
      transition: background var(--transition), transform var(--transition);
    }

    .profile-pill:hover {
      background: var(--bg-subtle);
    }

    .mode-switch {
      display: inline-flex;
      background: var(--bg-subtle);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-pill);
      padding: 3px;
      gap: 2px;
    }

    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.8rem;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .mode-btn.active {
      background: var(--accent);
      color: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-soft);
      color: var(--text-primary);
      border-radius: var(--radius-pill);
      padding: 8px 13px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all var(--transition);
    }

    .icon-btn:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .icon-btn:active {
      transform: scale(0.97);
    }

    /* Speech / Sentence Bar */
    .speech-panel {
      background: var(--bg-surface);
      border: 2px solid var(--border-strong);
      border-radius: var(--radius-lg);
      padding: 12px 14px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      min-height: 76px;
    }

    .speech-strip {
      flex: 1 1 260px;
      min-height: 50px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      padding: 4px 6px;
      border-radius: 12px;
      background: var(--bg-page);
      border: 1.5px dashed var(--border-soft);
    }

    .speech-placeholder {
      color: var(--text-secondary);
      font-size: 0.92rem;
      font-weight: 600;
      padding: 4px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .phrase-token {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1.5px solid var(--accent-border);
      border-radius: 12px;
      padding: 6px 10px;
      font-size: 0.9rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-primary);
      box-shadow: var(--shadow-sm);
    }

    .phrase-token svg {
      width: 22px;
      height: 22px;
      flex-shrink: 0;
    }

    .phrase-token img {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      object-fit: cover;
    }

    .direct-spoken-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 10px;
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--accent);
      letter-spacing: 0.01em;
    }

    .speech-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-speak {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-md);
      padding: 13px 20px;
      font-size: 0.96rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background var(--transition), transform var(--transition);
      min-height: 50px;
    }

    .btn-speak:hover {
      background: var(--accent-hover);
    }

    .btn-speak:active {
      transform: scale(0.97);
    }

    .btn-speak:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary-act {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--bg-subtle);
      color: var(--text-primary);
      border: 1.5px solid var(--border-soft);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      min-height: 50px;
      transition: all var(--transition);
    }

    .btn-secondary-act:hover {
      border-color: var(--border-strong);
      background: var(--bg-surface);
    }

    .btn-secondary-act:active {
      transform: scale(0.97);
    }

    .btn-secondary-act:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* Navigation Bar (Home + Categories) */
    .nav-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 2px 6px;
      scrollbar-width: thin;
      scrollbar-color: var(--border-strong) transparent;
    }

    .nav-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 15px;
      border-radius: var(--radius-pill);
      border: 1.5px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 0.84rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
      transition: all var(--transition);
      min-height: 44px;
    }

    .nav-chip:hover {
      border-color: var(--accent-border);
      background: var(--accent-soft);
    }

    .nav-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
      box-shadow: var(--shadow-sm);
    }

    .nav-chip svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    /* Section Context Header */
    .board-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      padding: 2px 4px;
    }

    .board-title-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-strong);
      color: var(--text-primary);
      padding: 8px 14px;
      border-radius: var(--radius-pill);
      font-size: 0.84rem;
      font-weight: 800;
      text-transform: uppercase;
      cursor: pointer;
      transition: all var(--transition);
    }

    .btn-back-home:hover {
      background: var(--accent-soft);
      border-color: var(--accent);
    }

    .board-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      color: var(--text-primary);
    }

    .board-hint {
      font-size: 0.84rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* AAC Card Grid */
    .aac-grid {
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
      gap: 14px;
      width: 100%;
    }

    .aac-card {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--bg-surface);
      border: 2.5px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px 12px 14px;
      min-height: 158px;
      cursor: pointer;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: transform var(--transition), border-color var(--transition), box-shadow var(--transition), background var(--transition);
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .aac-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
    }

    .aac-card:active,
    .aac-card.speaking {
      transform: scale(0.975);
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-soft);
    }

    /* Soft category accent bar on top of each card */
    .aac-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: var(--card-accent, var(--accent-border));
    }

    .aac-card.tone-core { background: var(--bg-surface); border-color: var(--cat-core-b); --card-accent: var(--cat-core-b); }
    .aac-card.tone-alert { background: var(--danger-soft); border-color: var(--danger-border); --card-accent: var(--danger-border); }
    .aac-card.tone-food { background: var(--bg-surface); border-color: var(--cat-food-b); --card-accent: var(--cat-food-b); }
    .aac-card.tone-play { background: var(--bg-surface); border-color: var(--cat-play-b); --card-accent: var(--cat-play-b); }
    .aac-card.tone-hygiene { background: var(--bg-surface); border-color: var(--cat-hygiene-b); --card-accent: var(--cat-hygiene-b); }
    .aac-card.tone-school { background: var(--bg-surface); border-color: var(--cat-school-b); --card-accent: var(--cat-school-b); }
    .aac-card.tone-people { background: var(--bg-surface); border-color: var(--cat-people-b); --card-accent: var(--cat-people-b); }
    .aac-card.tone-body { background: var(--bg-surface); border-color: var(--cat-body-b); --card-accent: var(--cat-body-b); }
    .aac-card.tone-actions { background: var(--bg-surface); border-color: var(--cat-actions-b); --card-accent: var(--cat-actions-b); }
    .aac-card.tone-daily { background: var(--bg-surface); border-color: var(--cat-daily-b); --card-accent: var(--cat-daily-b); }
    .aac-card.tone-money { background: var(--bg-surface); border-color: var(--cat-money-b); --card-accent: var(--cat-money-b); }
    .aac-card.tone-transport { background: var(--bg-surface); border-color: var(--cat-transport-b); --card-accent: var(--cat-transport-b); }
    .aac-card.tone-interests { background: var(--bg-surface); border-color: var(--cat-interests-b); --card-accent: var(--cat-interests-b); }

    .card-visual {
      width: 82px;
      height: 82px;
      border-radius: 16px;
      background: var(--bg-page);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
    }

    .card-visual svg {
      width: 56px;
      height: 56px;
      color: var(--accent);
    }

    .aac-card.tone-alert .card-visual svg {
      color: var(--danger-text);
    }

    .card-visual.has-photo {
      width: 100%;
      height: 104px;
      border-radius: 12px;
    }

    .card-visual img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-label {
      font-size: 1.02rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.2;
      color: var(--text-primary);
      word-break: break-word;
    }

    .aac-card.tone-alert .card-label {
      color: var(--danger-text);
    }

    /* Prominent "MAIS MENSAGENS >" CTA (Slide 5) */
    .more-messages-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: var(--radius-pill);
      padding: 16px 24px;
      font-size: 1.08rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background var(--transition), transform var(--transition);
      margin-top: 4px;
    }

    .more-messages-btn:hover {
      background: var(--accent-hover);
    }

    .more-messages-btn:active {
      transform: scale(0.985);
    }

    /* Category Directory Grid (when MAIS MENSAGENS is opened) */
    .categories-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .cat-folder-card {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--bg-surface);
      border: 2px solid var(--border-soft);
      border-radius: var(--radius-lg);
      padding: 16px;
      cursor: pointer;
      text-align: left;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition);
    }

    .cat-folder-card:hover {
      border-color: var(--accent);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }

    .cat-folder-icon {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      background: var(--accent-soft);
      color: var(--accent);
    }

    .cat-folder-icon svg {
      width: 34px;
      height: 34px;
    }

    .cat-folder-info h3 {
      margin: 0;
      font-size: 0.96rem;
      font-weight: 800;
      text-transform: uppercase;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .cat-folder-info p {
      margin: 4px 0 0;
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-weight: 600;
    }

    /* Modals */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 29, 44, 0.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1.5px solid var(--border-soft);
      border-radius: 22px;
      width: 100%;
      max-width: 760px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1.5px solid var(--border-soft);
      background: var(--bg-page);
    }

    .modal-header h2 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 800;
    }

    .modal-close {
      background: var(--bg-surface);
      border: 1.5px solid var(--border-soft);
      color: var(--text-primary);
      border-radius: 10px;
      width: 36px;
      height: 36px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-tabs {
      display: flex;
      gap: 6px;
      padding: 10px 20px;
      background: var(--bg-page);
      border-bottom: 1.5px solid var(--border-soft);
      overflow-x: auto;
    }

    .modal-tab {
      border: 1.5px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--text-secondary);
      border-radius: var(--radius-pill);
      padding: 7px 14px;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .modal-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #FFFFFF;
    }

    .modal-body {
      padding: 18px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .settings-section {
      background: var(--bg-page);
      border: 1.5px solid var(--border-soft);
      border-radius: 14px;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .settings-section h3 {
      margin: 0;
      font-size: 0.94rem;
      font-weight: 800;
      color: var(--text-primary);
    }

    .field-row {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
    }

    .field-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .input-ctrl, .select-ctrl {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1.5px solid var(--border-soft);
      background: var(--bg-surface);
      color: var(--text-primary);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 6px 0;
    }

    .toggle-row span {
      font-size: 0.88rem;
      font-weight: 700;
    }

    .toggle-row small {
      display: block;
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .btn-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn-primary-sm {
      background: var(--accent);
      color: #FFFFFF;
      border: none;
      border-radius: 10px;
      padding: 10px 16px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-primary-sm:hover {
      background: var(--accent-hover);
    }

    .btn-outline-sm {
      background: var(--bg-surface);
      color: var(--text-primary);
      border: 1.5px solid var(--border-strong);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-danger-sm {
      background: var(--danger-soft);
      color: var(--danger-text);
      border: 1.5px solid var(--danger-border);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .card-manage-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 10px;
      max-height: 260px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .manage-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--bg-surface);
      border: 1.5px solid var(--border-soft);
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 0.82rem;
    }

    .manage-item strong {
      display: block;
      text-transform: uppercase;
      font-size: 0.8rem;
    }

    .manage-item small {
      color: var(--text-secondary);
      font-size: 0.74rem;
    }

    .photo-preview-box {
      width: 96px;
      height: 96px;
      border-radius: 14px;
      border: 1.5px dashed var(--border-strong);
      background: var(--bg-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-size: 0.75rem;
      color: var(--text-secondary);
      text-align: center;
      padding: 6px;
    }

    .photo-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .info-step {
      background: var(--bg-surface);
      border-left: 4px solid var(--accent);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.84rem;
      line-height: 1.45;
      color: var(--text-primary);
    }

    .info-step code {
      background: var(--bg-subtle);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.8rem;
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text-primary);
      color: var(--bg-surface);
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.86rem;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 200ms ease, transform 200ms ease;
      z-index: 2000;
      box-shadow: var(--shadow-md);
      max-width: 92vw;
      text-align: center;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* Responsive adjustments */
    @media (max-width: 680px) {
      .app-shell {
        padding: 10px 10px 24px;
      }
      .aac-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
        gap: 10px;
      }
      .aac-card {
        min-height: 138px;
        padding: 12px 8px;
      }
      .card-visual {
        width: 68px;
        height: 68px;
      }
      .card-visual svg {
        width: 46px;
        height: 46px;
      }
      .card-label {
        font-size: 0.9rem;
      }
      .btn-speak, .btn-secondary-act {
        flex: 1 1 auto;
        padding: 11px 12px;
        min-height: 44px;
      }
    }
  </style>
</head>

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return createDefaultState();
          const parsed = JSON.parse(raw);
          if (!parsed || !parsed.profiles || !parsed.activeProfileId || !parsed.profiles[parsed.activeProfileId]) {
            return createDefaultState();
          }
          return parsed;
        } catch (err) {
          return createDefaultState();
        }
      }

        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));

      let phraseTokens = [];
      let lastDirectSpoken = '';
      let activeSettingsTab = 'profile';
      let pendingPhotoDataUrl = '';
      let availableVoices = [];

      function getProfile() {
        return state.profiles[state.activeProfileId];
      }

      /* =====================================================================
       * 4. SPEECH SYNTHESIS (PT-BR OFFLINE) + SOFT AUDIO FEEDBACK
       * ===================================================================== */
      let audioCtx = null;

      function playSoftChime() {
        const prof = getProfile();
        if (!prof.softSound) return;
        try {
          const Ctx = window.AudioContext || window.webkitAudioContext;
          if (!Ctx) return;
          if (!audioCtx) audioCtx = new Ctx();
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(620, audioCtx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.13);
        } catch (e) {
          /* ignore audio context restrictions */
        }
      }

      function refreshVoices() {
        if (!('speechSynthesis' in window)) return;
        const list = window.speechSynthesis.getVoices() || [];
        availableVoices = list.filter(v => (v.lang || '').toLowerCase().startsWith('pt'));
        if (!availableVoices.length) availableVoices = list;
      }

      if ('speechSynthesis' in window) {
        refreshVoices();
        window.speechSynthesis.onvoiceschanged = refreshVoices;
      }

      function speakText(text) {
        const clean = (text || '').trim();
        if (!clean) return;
        playSoftChime();
        if (!('speechSynthesis' in window)) {
          showToast('Voz indisponível neste navegador: "' + clean + '"');
          return;
        }
        try {
          window.speechSynthesis.cancel();
          const utter = new SpeechSynthesisUtterance(clean);
          const prof = getProfile();
          utter.lang = 'pt-BR';
          utter.rate = Number(prof.voiceRate) || 0.92;
          utter.pitch = 1.0;
          if (prof.voiceURI && availableVoices.length) {
            const found = availableVoices.find(v => v.voiceURI === prof.voiceURI);
            if (found) utter.voice = found;
          } else if (availableVoices.length) {
            const ptBr = availableVoices.find(v => (v.lang || '').toLowerCase() === 'pt-br') || availableVoices[0];
            if (ptBr) utter.voice = ptBr;
          }
          window.speechSynthesis.speak(utter);
        } catch (e) {
          showToast('Mensagem: ' + clean);
        }
      }

      /* =====================================================================
       * 5. RENDERING ENGINE
       * ===================================================================== */
      const elProfileName = document.getElementById('activeProfileName');
      const elBtnDirect = document.getElementById('btnModeDirect');
      const elBtnPhrase = document.getElementById('btnModePhrase');
      const elSpeechStrip = document.getElementById('speechStrip');
      const elBtnSpeak = document.getElementById('btnSpeakPhrase');
      const elBtnUndo = document.getElementById('btnUndoWord');
      const elBtnClear = document.getElementById('btnClearPhrase');
      const elCategoryNav = document.getElementById('categoryNav');
      const elBoardContainer = document.getElementById('boardContainer');
      const elBoardTitle = document.getElementById('boardTitle');
      const elBoardHint = document.getElementById('boardHint');
      const elBtnBackHome = document.getElementById('btnBackHome');
      const elOfflineStatus = document.getElementById('offlineStatusText');

      function applyThemeAndGrid() {
        const prof = getProfile();
        document.documentElement.setAttribute('data-theme', prof.theme === 'calm' ? '' : prof.theme);
        document.documentElement.setAttribute('data-reduce-motion', prof.reduceMotion ? 'true' : 'false');
        document.documentElement.style.setProperty('--grid-cols', String(prof.gridCols || 3));
      }

      function getVisibleCategories() {
        const prof = getProfile();
        if (prof.scopeMode === 'prototype') {
          return CATEGORIES.filter(c => c.prototype);
        }
        return CATEGORIES;
      }

      function renderTopControls() {
        const prof = getProfile();
        elProfileName.textContent = prof.name;
        elBtnDirect.classList.toggle('active', prof.speechMode === 'direct');
        elBtnPhrase.classList.toggle('active', prof.speechMode === 'phrase');
        elOfflineStatus.textContent = navigator.onLine ? 'Online • Pronto para uso offline' : 'Modo Offline ativo';
      }

      function renderSpeechBar() {
        const prof = getProfile();
        elSpeechStrip.innerHTML = '';

        if (prof.speechMode === 'direct') {
          if (lastDirectSpoken) {
            const banner = document.createElement('div');
            banner.className = 'direct-spoken-banner';
            banner.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/></svg><span></span>';
            banner.querySelector('span').textContent = '“' + lastDirectSpoken + '”';
            elSpeechStrip.appendChild(banner);
          } else {
            const ph = document.createElement('div');
            ph.className = 'speech-placeholder';
            ph.textContent = 'Modo 1 Toque: toque em qualquer cartão para falar imediatamente.';
            elSpeechStrip.appendChild(ph);
          }
          elBtnSpeak.disabled = !lastDirectSpoken;
          elBtnUndo.disabled = true;
          elBtnClear.disabled = !lastDirectSpoken;
        } else {
          if (!phraseTokens.length) {
            const ph = document.createElement('div');
            ph.className = 'speech-placeholder';
            ph.textContent = 'Modo Montar Frase: toque nos cartões (ex.: EU QUERO + ÁGUA) e depois em FALAR.';
            elSpeechStrip.appendChild(ph);
          } else {
            phraseTokens.forEach(tok => {
              const chip = document.createElement('span');
              chip.className = 'phrase-token';
              if (tok.photo) {
                const img = document.createElement('img');
                img.src = tok.photo;
                img.alt = tok.label;
                chip.appendChild(img);
              } else {
                const iconWrap = document.createElement('span');
                iconWrap.innerHTML = ICONS[tok.icon] || ICONS.spark;
                chip.appendChild(iconWrap.firstChild);
              }
              const txt = document.createElement('span');
              txt.textContent = tok.word || tok.label;
              chip.appendChild(txt);
              elSpeechStrip.appendChild(chip);
            });
          }
          elBtnSpeak.disabled = phraseTokens.length === 0;
          elBtnUndo.disabled = phraseTokens.length === 0;
          elBtnClear.disabled = phraseTokens.length === 0;
        }
      }

      function renderCategoryNav() {
        const cats = getVisibleCategories();
        elCategoryNav.innerHTML = '';

        const homeChip = document.createElement('button');
        homeChip.type = 'button';
        homeChip.className = 'nav-chip' + (currentView === 'home' ? ' active' : '');
        homeChip.innerHTML = ICONS.home + '<span>INÍCIO</span>';
        homeChip.addEventListener('click', () => {
          currentView = 'home';
          renderAll();
        });
        elCategoryNav.appendChild(homeChip);

        const allChip = document.createElement('button');
        allChip.type = 'button';
        allChip.className = 'nav-chip' + (currentView === 'categories' ? ' active' : '');
        allChip.innerHTML = ICONS.grid + '<span>CATEGORIAS</span>';
        allChip.addEventListener('click', () => {
          currentView = 'categories';
          renderAll();
        });
        elCategoryNav.appendChild(allChip);

        cats.forEach(cat => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'nav-chip' + (currentView === cat.id ? ' active' : '');
          btn.innerHTML = (ICONS[cat.icon] || ICONS.spark) + '<span></span>';
          btn.querySelector('span').textContent = cat.name;
          btn.addEventListener('click', () => {
            currentView = cat.id;
            renderAll();
          });
          elCategoryNav.appendChild(btn);
        });
      }

      function handleCardTap(card, cardEl) {
        const prof = getProfile();
        cardEl.classList.add('speaking');
        setTimeout(() => cardEl.classList.remove('speaking'), 340);

        if (prof.speechMode === 'direct') {
          lastDirectSpoken = card.speech || card.label;
          speakText(lastDirectSpoken);
          renderSpeechBar();
        } else {
          phraseTokens.push(card);
          speakText(card.word || card.label);
          renderSpeechBar();
        }
      }

      function createCardElement(card) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'aac-card tone-' + (card.tone || 'core');
        btn.setAttribute('aria-label', card.label);

        const visual = document.createElement('div');
        visual.className = 'card-visual' + (card.photo ? ' has-photo' : '');
        if (card.photo) {
          const img = document.createElement('img');
          img.src = card.photo;
          img.alt = card.label;
          visual.appendChild(img);
        } else {
          visual.innerHTML = ICONS[card.icon] || ICONS.spark;
        }

        const label = document.createElement('span');
        label.className = 'card-label';
        label.textContent = card.label;

        btn.appendChild(visual);
        btn.appendChild(label);
        btn.addEventListener('click', () => handleCardTap(card, btn));
        return btn;
      }

      function renderBoard() {
        const prof = getProfile();
        elBoardContainer.innerHTML = '';

        if (currentView === 'home') {
          elBtnBackHome.style.display = 'none';
          elBoardTitle.textContent = 'COMUNICAÇÃO IMEDIATA';
          elBoardHint.textContent = prof.speechMode === 'direct'
            ? 'Atalhos fixos ao alcance de um toque'
            : 'Toque nos cartões para combinar palavras';

          const homeCards = prof.cards.filter(c => c.cat === 'home' && !c.hidden);
          const limit = Number(prof.homeLimit) || 6;
          const visibleHomeCards = homeCards.slice(0, limit);

          const grid = document.createElement('div');
          grid.className = 'aac-grid';
          visibleHomeCards.forEach(c => grid.appendChild(createCardElement(c)));
          elBoardContainer.appendChild(grid);

          const moreBtn = document.createElement('button');
          moreBtn.type = 'button';
          moreBtn.className = 'more-messages-btn';
          moreBtn.innerHTML = '<span>MAIS MENSAGENS</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
          moreBtn.addEventListener('click', () => {
            currentView = 'categories';
            renderAll();
          });
          elBoardContainer.appendChild(moreBtn);
          return;
        }

        if (currentView === 'categories') {
          elBtnBackHome.style.display = 'inline-flex';
          elBoardTitle.textContent = 'CATEGORIAS DE COMUNICAÇÃO';
          elBoardHint.textContent = prof.scopeMode === 'prototype'
            ? 'Modo Protótipo Inicial (2 categorias prioritárias)'
            : 'Todas as 11 categorias disponíveis';

          const cats = getVisibleCategories();
          const dir = document.createElement('div');
          dir.className = 'categories-grid';

          cats.forEach(cat => {
            const count = prof.cards.filter(c => c.cat === cat.id && !c.hidden).length;
            const folder = document.createElement('button');
            folder.type = 'button';
            folder.className = 'cat-folder-card';
            folder.innerHTML = '<div class="cat-folder-icon"></div><div class="cat-folder-info"><h3></h3><p></p></div>';
            folder.querySelector('.cat-folder-icon').innerHTML = ICONS[cat.icon] || ICONS.spark;
            folder.querySelector('h3').textContent = cat.name;
            folder.querySelector('p').textContent = cat.desc + ' (' + count + ' cartões)';
            folder.addEventListener('click', () => {
              currentView = cat.id;
              renderAll();
            });
            dir.appendChild(folder);
          });

          elBoardContainer.appendChild(dir);
          return;
        }

        /* Specific Category View */
        const catObj = CATEGORIES.find(c => c.id === currentView);
        elBtnBackHome.style.display = 'inline-flex';
        elBoardTitle.textContent = catObj ? catObj.name : 'CATEGORIA';
        elBoardHint.textContent = catObj ? catObj.desc : '';

        const catCards = prof.cards.filter(c => c.cat === currentView && !c.hidden);
        const grid = document.createElement('div');
        grid.className = 'aac-grid';
        catCards.forEach(c => grid.appendChild(createCardElement(c)));
        elBoardContainer.appendChild(grid);
      }

      function renderAll() {
        applyThemeAndGrid();
        renderTopControls();
        renderSpeechBar();
        renderCategoryNav();
        renderBoard();
      }

      /* =====================================================================
       * 6. EDUCATOR / PERSONALIZATION MODAL
       * ===================================================================== */
      const elModal = document.getElementById('settingsModal');
      const elModalBody = document.getElementById('settingsModalBody');

      function openSettings() {
        refreshVoices();
        elModal.classList.add('open');
        renderSettingsTab();
      }

      function closeSettings() {
        elModal.classList.remove('open');
        pendingPhotoDataUrl = '';
      }

      function renderSettingsTab() {
        document.querySelectorAll('.modal-tab').forEach(t => {
          t.classList.toggle('active', t.getAttribute('data-tab') === activeSettingsTab);
        });

        const prof = getProfile();
        elModalBody.innerHTML = '';

        if (activeSettingsTab === 'profile') {
          const sec1 = document.createElement('div');
          sec1.className = 'settings-section';
          sec1.innerHTML = '<h3>1. Perfil do Estudante</h3>';

          const row = document.createElement('div');
          row.className = 'field-grid';

          const selWrap = document.createElement('div');
          selWrap.className = 'field-row';
          selWrap.innerHTML = '<label class="field-label" for="selProfile">Estudante ativo</label>';
          const sel = document.createElement('select');
          sel.id = 'selProfile';
          sel.className = 'select-ctrl';
          Object.values(state.profiles).forEach(p => {
            const opt = document.createElement('option');
            opt.value = p.id;
            opt.textContent = p.name;
            opt.selected = p.id === state.activeProfileId;
            sel.appendChild(opt);
          });
          sel.addEventListener('change', () => {
            state.activeProfileId = sel.value;
            phraseTokens = [];
            lastDirectSpoken = '';
            currentView = 'home';

            renderAll();
            renderSettingsTab();

          });
          selWrap.appendChild(sel);

          const addWrap = document.createElement('div');
          addWrap.className = 'field-row';
          addWrap.innerHTML = '<label class="field-label" for="inpNewProfile">Criar novo perfil</label>';
          const addInline = document.createElement('div');
          addInline.style.display = 'flex';
          addInline.style.gap = '6px';
          const inpNew = document.createElement('input');
          inpNew.id = 'inpNewProfile';
          inpNew.className = 'input-ctrl';
          inpNew.placeholder = 'Ex.: LUCAS';
          const btnAddProf = document.createElement('button');
          btnAddProf.type = 'button';
          btnAddProf.className = 'btn-primary-sm';
          btnAddProf.textContent = 'Criar';
          btnAddProf.addEventListener('click', () => {
            const name = inpNew.value.trim().toUpperCase();
            if (!name) return showToast('Digite o nome do estudante.');
            const id = 'prof_' + Date.now();
            state.profiles[id] = {
              id, name, gridCols: 3, homeLimit: 6, scopeMode: 'all',
              speechMode: 'direct', theme: 'calm', reduceMotion: false,
              softSound: true, voiceRate: 0.92, voiceURI: '', cards: buildDefaultCards()
            };
            state.activeProfileId = id;
            saveState();
            renderAll();
            renderSettingsTab();
            showToast('Perfil ' + name + ' criado!');
          });
          addInline.appendChild(inpNew);
          addInline.appendChild(btnAddProf);
          addWrap.appendChild(addInline);

          row.appendChild(selWrap);
          row.appendChild(addWrap);
          sec1.appendChild(row);
          elModalBody.appendChild(sec1);

          /* Visual & Sensory Comfort */
          const sec2 = document.createElement('div');
          sec2.className = 'settings-section';
          sec2.innerHTML = '<h3>2. Conforto Sensorial & Quantidade de Opções</h3>';

          const grid2 = document.createElement('div');
          grid2.className = 'field-grid';

          grid2.innerHTML =
            '<div class="field-row">' +
              '<label class="field-label" for="selTheme">Paleta de cores (baixo estímulo)</label>' +
              '<select id="selTheme" class="select-ctrl">' +
                '<option value="calm">Calmo Creme & Verde (Padrão)</option>' +

            '</div>' +

              '<label class="field-label" for="selGridCols">Tamanho dos botões (colunas no tablet)</label>' +

                '<option value="3">3 colunas (Padrão tablet)</option>' +
                '<option value="4">4 colunas (Repertório ampliado)</option>' +
              '</select>' +
            '</div>' +
            '<div class="field-row">' +
              '<label class="field-label" for="selHomeLimit">Atalhos na Tela Inicial</label>' +
              '<select id="selHomeLimit" class="select-ctrl">' +
                '<option value="6">6 cartões essenciais (Foco máximo)</option>' +
                '<option value="9">9 cartões essenciais</option>' +
                '<option value="12">12 cartões essenciais</option>' +
                '<option value="15">15 cartões (Completo)</option>' +
              '</select>' +
            '</div>' +
            '<div class="field-row">' +
              '<label class="field-label" for="selScope">Escopo de Categorias</label>' +
              '<select id="selScope" class="select-ctrl">' +
                '<option value="all">Todas as 11 categorias</option>' +
                '<option value="prototype">Protótipo Inicial (Alimentação + Brinquedos)</option>' +
              '</select>' +
            '</div>';

          sec2.appendChild(grid2);

          const toggleMotion = document.createElement('div');
          toggleMotion.className = 'toggle-row';
          toggleMotion.innerHTML = '<div><span>Reduzir animações visuais</span><small>Desativa transições para maior conforto sensorial</small></div><input type="checkbox" id="chkReduceMotion" style="width:20px;height:20px;accent-color:var(--accent);">';
          sec2.appendChild(toggleMotion);
          elModalBody.appendChild(sec2);

          const selTheme = sec2.querySelector('#selTheme');
          const selCols = sec2.querySelector('#selGridCols');
          const selLimit = sec2.querySelector('#selHomeLimit');
          const selScope = sec2.querySelector('#selScope');
          const chkMotion = sec2.querySelector('#chkReduceMotion');

          selTheme.value = prof.theme || 'calm';
          selCols.value = String(prof.gridCols || 3);
          selLimit.value = String(prof.homeLimit || 6);
          selScope.value = prof.scopeMode || 'all';
          chkMotion.checked = Boolean(prof.reduceMotion);

          selTheme.addEventListener('change', () => { prof.theme = selTheme.value; saveState(); renderAll(); });
          selCols.addEventListener('change', () => { prof.gridCols = Number(selCols.value); saveState(); renderAll(); });
          selLimit.addEventListener('change', () => { prof.homeLimit = Number(selLimit.value); saveState(); renderAll(); });
          selScope.addEventListener('change', () => { prof.scopeMode = selScope.value; currentView = 'home'; saveState(); renderAll(); });
          chkMotion.addEventListener('change', () => { prof.reduceMotion = chkMotion.checked; saveState(); renderAll(); });
          return;
        }

        if (activeSettingsTab === 'cards') {
          const secAdd = document.createElement('div');
          secAdd.className = 'settings-section';

            '<h3>Adicionar Novo Cartão com Foto Real ou Pictograma</h3>' +

              '<div class="field-row"><label class="field-label" for="inpCardSpeech">Mensagem falada completa</label><input id="inpCardSpeech" class="input-ctrl" placeholder="Ex.: Quero ir ao pátio."></div>' +
              '<div class="field-row"><label class="field-label" for="selCardCat">Categoria</label><select id="selCardCat" class="select-ctrl"></select></div>' +
              '<div class="field-row"><label class="field-label" for="selCardIcon">Ícone (se não enviar foto)</label><select id="selCardIcon" class="select-ctrl"></select></div>' +
            '</div>' +
            '<div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:4px;">' +
              '<div class="photo-preview-box" id="photoPreviewBox">Sem foto</div>' +
              '<div class="field-row" style="flex:1;min-width:180px;">' +
                '<label class="field-label" for="inpCardPhoto">Foto real (familiar, escola, objeto)</label>' +
                '<input id="inpCardPhoto" type="file" accept="image/*" class="input-ctrl">' +
              '</div>' +
              '<button type="button" id="btnAddCardSubmit" class="btn-primary-sm">Salvar Cartão</button>' +
            '</div>';

          const selCat = secAdd.querySelector('#selCardCat');
          const optHome = document.createElement('option');
          optHome.value = 'home';
          optHome.textContent = 'TELA INICIAL (COMUNICAÇÃO IMEDIATA)';
          selCat.appendChild(optHome);
          CATEGORIES.forEach(c => {
            const o = document.createElement('option');
            o.value = c.id;
            o.textContent = c.name;
            selCat.appendChild(o);

          const selIcon = secAdd.querySelector('#selCardIcon');
          const iconLabels = {
            star: 'Estrela', tree: 'Pátio / Parque', school: 'Escola', person: 'Pessoa',
            apple: 'Comida / Fruta', water: 'Bebida', play: 'Brinquedo / Bola',
            toilet: 'Banheiro', book: 'Livro / Caderno', car: 'Carro', bus: 'Ônibus',
            music: 'Música', tv: 'Desenho / TV', want: 'Coração / Quero', help: 'Ajuda'
          };
          Object.keys(iconLabels).forEach(k => {
            const o = document.createElement('option');
            o.value = k;
            o.textContent = iconLabels[k];
            selIcon.appendChild(o);
          });

          const inpPhoto = secAdd.querySelector('#inpCardPhoto');
          const previewBox = secAdd.querySelector('#photoPreviewBox');
          inpPhoto.addEventListener('change', () => {

            prof.cards.unshift({
              id: 'custom_' + Date.now(),
              cat: catId,
              label: label,
              speech: speech,
              word: label,
              icon: selIcon.value,
              tone: catMeta ? catMeta.tone : 'core',
              photo: pendingPhotoDataUrl || ''
            });

            saveState();
            renderAll();
            renderSettingsTab();
            showToast('Cartão "' + label + '" adicionado para ' + prof.name + '!');

            right.appendChild(btnToggle);

            if (card.id.startsWith('custom_')) {
              const btnDel = document.createElement('button');
              btnDel.type = 'button';
              btnDel.className = 'btn-danger-sm';
              btnDel.style.padding = '5px 8px';
              btnDel.style.fontSize = '0.74rem';
              btnDel.textContent = 'Excluir';
              btnDel.addEventListener('click', () => {
                prof.cards = prof.cards.filter(x => x.id !== card.id);
                saveState();
                renderAll();
                renderSettingsTab();
              });
              right.appendChild(btnDel);
            }

            item.appendChild(left);
            item.appendChild(right);
            listWrap.appendChild(item);
          });

          secList.appendChild(listWrap);
          elModalBody.appendChild(secList);
          return;
        }

        if (activeSettingsTab === 'voice') {
          const secVoice = document.createElement('div');
          secVoice.className = 'settings-section';
          secVoice.innerHTML =
            '<h3>Síntese de Voz em Português (Offline no Tablet)</h3>' +
            '<div class="field-grid">' +
              '<div class="field-row"><label class="field-label" for="selVoice">Voz instalada no dispositivo</label><select id="selVoice" class="select-ctrl"></select></div>' +
              '<div class="field-row"><label class="field-label" for="rngRate">Velocidade da fala: <span id="lblRate"></span></label><input id="rngRate" type="range" min="0.7" max="1.2" step="0.05"></div>' +
            '</div>' +
            '<div class="toggle-row"><div><span>Toque sonoro suave ao clicar</span><small>Som curto e gentil para confirmação tátil</small></div><input type="checkbox" id="chkSoftSound" style="width:20px;height:20px;accent-color:var(--accent);"></div>' +
            '<div class="btn-row"><button type="button" id="btnTestVoice" class="btn-primary-sm">Testar Voz Agora</button></div>';

          const selVoice = secVoice.querySelector('#selVoice');
          const optAuto = document.createElement('option');
          optAuto.value = '';
          optAuto.textContent = 'Automática (Português do Brasil)';
          selVoice.appendChild(optAuto);

          availableVoices.forEach(v => {
            const o = document.createElement('option');
            o.value = v.voiceURI;
            o.textContent = v.name + ' (' + v.lang + ')' + (v.localService ? ' • Offline' : '');
            if (prof.voiceURI === v.voiceURI) o.selected = true;
            selVoice.appendChild(o);
          });

          const rngRate = secVoice.querySelector('#rngRate');
          const lblRate = secVoice.querySelector('#lblRate');
          const chkSound = secVoice.querySelector('#chkSoftSound');

          rngRate.value = String(prof.voiceRate || 0.92);
          lblRate.textContent = Number(rngRate.value).toFixed(2) + 'x';
          chkSound.checked = Boolean(prof.softSound);

          selVoice.addEventListener('change', () => { prof.voiceURI = selVoice.value; saveState(); });
          rngRate.addEventListener('input', () => {
            prof.voiceRate = Number(rngRate.value);
            lblRate.textContent = prof.voiceRate.toFixed(2) + 'x';
            saveState();
          });
          chkSound.addEventListener('change', () => { prof.softSound = chkSound.checked; saveState(); });
          secVoice.querySelector('#btnTestVoice').addEventListener('click', () => {
            speakText('Olá! Eu quero água, por favor.');
          });

          elModalBody.appendChild(secVoice);

          const secCheck = document.createElement('div');
          secCheck.className = 'settings-section';
          const localPt = availableVoices.filter(v => v.localService && (v.lang || '').toLowerCase().startsWith('pt')).length;
          secCheck.innerHTML =
            '<h3>Diagnóstico de Voz Offline</h3>' +
            '<div class="info-step">Vozes em português detectadas neste aparelho: <strong>' + availableVoices.length + '</strong> (locais/offline: <strong>' + localPt + '</strong>).<br>No Android, para garantir fala sem internet, acesse <em>Configurações → Acessibilidade → Conversão de texto em voz</em> e baixe o pacote <strong>Português (Brasil)</strong>.</div>';
          elModalBody.appendChild(secCheck);
          return;
        }

        if (activeSettingsTab === 'deploy') {
          const secBackup = document.createElement('div');
          secBackup.className = 'settings-section';
          secBackup.innerHTML =
            '<h3>Backup e Transferência entre Tablets</h3>' +
            '<p style="margin:0;font-size:0.84rem;color:var(--text-secondary);">Exporte as configurações e fotos personalizadas do Igor e da Lívia em um arquivo JSON para restaurar em outro tablet.</p>' +
            '<div class="btn-row">' +
              '<button type="button" id="btnExportJson" class="btn-primary-sm">Exportar Backup (.json)</button>' +
              '<label class="btn-outline-sm" style="display:inline-flex;align-items:center;cursor:pointer;">Importar Backup (.json)<input type="file" id="inpImportJson" accept=".json" style="display:none;"></label>' +
              '<button type="button" id="btnResetDefaults" class="btn-danger-sm">Restaurar Padrão</button>' +
            '</div>';

          secBackup.querySelector('#btnExportJson').addEventListener('click', () => {
            const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'comunica_caa_backup.json';
            a.click();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
            showToast('Backup exportado com sucesso!');
          });

          secBackup.querySelector('#inpImportJson').addEventListener('change', (ev) => {
            const file = ev.target.files && ev.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const imported = JSON.parse(String(reader.result));
                if (!imported || !imported.profiles || !imported.activeProfileId) {
                  return showToast('Arquivo de backup inválido.');
                }
                state = imported;
                saveState();
                renderAll();
                renderSettingsTab();
                showToast('Backup restaurado com sucesso!');
              } catch (e) {
                showToast('Não foi possível ler o arquivo JSON.');
              }
            };
            reader.readAsText(file);
          });

          secBackup.querySelector('#btnResetDefaults').addEventListener('click', () => {
            state = createDefaultState();
            phraseTokens = [];
            lastDirectSpoken = '';
            currentView = 'home';
            saveState();
            renderAll();
            renderSettingsTab();
            showToast('Perfis e cartões restaurados para o padrão inicial.');
          });

          elModalBody.appendChild(secBackup);

          const secDeploy = document.createElement('div');
          secDeploy.className = 'settings-section';
          secDeploy.innerHTML =
            '<h3>Publicação no GitHub Pages e APK Android</h3>' +
            '<div class="info-step"><strong>1. GitHub Pages:</strong> Crie um repositório no GitHub, envie este arquivo como <code>index.html</code> na raiz da branch <code>main</code> e ative <em>Settings → Pages → Branch: main</em>. Como não há dependências externas, ele carrega instantaneamente.</div>' +
            '<div class="info-step"><strong>2. APK Android Offline:</strong> Este site é 100% autocontido (HTML + CSS + JS + SVG embutidos). Você pode empacotar o <code>index.html</code> em um APK usando <strong>Capacitor</strong> (<code>npx cap add android</code>), <strong>WebView</strong> no Android Studio (pasta <code>assets/www/index.html</code>) ou <strong>PWABuilder</strong> a partir da URL do GitHub Pages.</div>';
          elModalBody.appendChild(secDeploy);
        }
      }

      /* Compress uploaded photo so it stays fast and fits localStorage */
      function compressImageFile(file, callback) {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const maxDim = 260;
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) { h = Math.round(h * maxDim / w); w = maxDim; }
            else if (h >= w && h > maxDim) { w = Math.round(w * maxDim / h); h = maxDim; }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            callback(canvas.toDataURL('image/jpeg', 0.78));
          };
          img.src = String(reader.result);
        };
        reader.readAsDataURL(file);
      }

      /* Toast helper */
      let toastTimer = null;
      const elToast = document.getElementById('toastEl');
      function showToast(msg) {
        elToast.textContent = msg;
        elToast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => elToast.classList.remove('show'), 2600);
      }

      /* =====================================================================
       * 7. EVENT LISTENERS
       * ===================================================================== */
      document.getElementById('btnSwitchProfile').addEventListener('click', () => {
        const ids = Object.keys(state.profiles);
        const nextIdx = (ids.indexOf(state.activeProfileId) + 1) % ids.length;
        state.activeProfileId = ids[nextIdx];
        phraseTokens = [];
        lastDirectSpoken = '';
        currentView = 'home';
        saveState();
        renderAll();
        showToast('Perfil ativo: ' + getProfile().name);
      });

      elBtnDirect.addEventListener('click', () => {
        getProfile().speechMode = 'direct';
        saveState();
        renderAll();
      });

      elBtnPhrase.addEventListener('click', () => {
        getProfile().speechMode = 'phrase';
        saveState();
        renderAll();
      });

      elBtnSpeak.addEventListener('click', () => {
        const prof = getProfile();
        if (prof.speechMode === 'direct') {
          if (lastDirectSpoken) speakText(lastDirectSpoken);
        } else if (phraseTokens.length) {
          const sentence = phraseTokens.map(t => t.word || t.label).join(' ');
          speakText(sentence);
        }
      });

      elBtnUndo.addEventListener('click', () => {
        if (!phraseTokens.length) return;
        phraseTokens.pop();
        renderSpeechBar();
      });

      elBtnClear.addEventListener('click', () => {
        phraseTokens = [];
        lastDirectSpoken = '';
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        renderSpeechBar();
      });

      elBtnBackHome.addEventListener('click', () => {
        currentView = 'home';
        renderAll();
      });

      document.getElementById('btnOpenSettings').addEventListener('click', openSettings);
      document.getElementById('btnCloseSettings').addEventListener('click', closeSettings);

      elModal.addEventListener('click', (e) => {
        if (e.target === elModal) closeSettings();
      });

      document.querySelectorAll('.modal-tab').forEach(tab => {
        tab.addEventListener('click', () => {
          activeSettingsTab = tab.getAttribute('data-tab');
          renderSettingsTab();
        });
      });

      window.addEventListener('online', renderTopControls);
      window.addEventListener('offline', renderTopControls);

      /* Initial Render */
      renderAll();
    })();
  </script>
</body>
</html>
